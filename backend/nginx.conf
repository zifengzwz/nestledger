worker_processes auto;
pid /tmp/nestledger-nginx.pid;
error_log /dev/stderr warn;
env MONGO_HOST;
env MONGO_PORT;
env MONGO_DATABASE;
env MONGO_USERNAME;
env MONGO_PASSWORD;
env MONGO_AUTH_SOURCE;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_DATABASE;
env APP_ORIGIN;
env COOKIE_SECURE;
env PBKDF2_ITERATIONS;
env SMS_HMAC_KEY;
env ALIYUN_ACCESS_KEY_ID;
env ALIYUN_ACCESS_KEY_SECRET;
env ALIYUN_SMS_SIGN_NAME;
env ALIYUN_SMS_REGISTER_TEMPLATE_CODE;
env ALIYUN_SMS_PHONE_CHANGE_TEMPLATE_CODE;
env ALIYUN_SMS_RESET_PASSWORD_TEMPLATE_CODE;
events { worker_connections 1024; }
http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    lua_package_path '__PROJECT_ROOT__/backend/lua/?.lua;__PROJECT_ROOT__/backend/lua/?/init.lua;;';
    lua_shared_dict nestledger 2m;
    lua_socket_log_errors off;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 4;
    resolver __DNS_RESOLVER__ ipv6=off valid=30s;
    resolver_timeout 2s;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    server {
        # Generated by scripts/dev-server.sh: HTTPS with TLS 1.2/1.3 by default.
        listen __SERVER_LISTEN__;
        # __TLS_CONFIG__
        root __PROJECT_ROOT__/frontend/dist;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = /api { default_type application/json; return 404 '{"error":{"code":"NOT_FOUND","message":"接口不存在"}}'; }
        # Only import gets a larger body allowance; ordinary APIs stay at 16k.
        location ~ ^/api/books/[^/]+/import$ {
            client_max_body_size 10m;
            error_page 413 = @api_body_too_large;
            error_page 400 414 429 500 502 503 504 = @api_error;
            content_by_lua_block { require('nestledger.api').run() }
        }
        location /api/ {
            error_page 413 = @api_body_too_large;
            error_page 400 414 429 500 502 503 504 = @api_error;
            content_by_lua_block { require('nestledger.api').run() }
        }
        location @api_body_too_large {
            default_type application/json;
            content_by_lua_block {
                ngx.status=413;
                ngx.say(require('cjson').encode({error={code='BODY_TOO_LARGE',message='请求内容过大'}}));
            }
        }
        location @api_error {
            default_type application/json;
            content_by_lua_block {
                local status=ngx.status;
                if status<400 then status=500 end;
                local code=status==413 and 'BODY_TOO_LARGE' or 'HTTP_ERROR';
                ngx.status=status;
                ngx.say(require('cjson').encode({error={code=code,message='请求无法处理'}}));
            }
        }
        location ~ /\. { deny all; }
        location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
